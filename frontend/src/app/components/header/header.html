<header class="app-header">
  <div class="header-inner">
    <a
      routerLink="/feed"
      class="brand-link"
      aria-label="Ir al inicio de Portal Retro"
      (click)="onLogoClick($event)"
    >
      <img
        src="assets/images/logo.png"
        alt="Portal Retro"
        class="brand-logo-img"
      />
    </a>

    <div class="header-actions">
      @if (esAdmin() && mostrarDashboard()) {
        <a routerLink="/dashboard" class="btn-dashboard-sm">
          Dashboard
        </a>
      }

      @if (mostrarPublicar()) {
        <button
          type="button"
          class="btn-new-post-sm"
          (click)="publicarClick.emit()"
        >
          + Publicar
        </button>
      }

      @if (mostrarVolverFeed()) {
        <a routerLink="/feed" class="btn-new-post-sm">
            ← Volver al Feed
        </a>
        }

      <div class="user-menu-wrapper">
        <button
          type="button"
          class="avatar-trigger"
          (click)="toggleMenuUsuario($event)"
          aria-label="Menú de usuario"
        >
          <img
            appAvatarHover
            [src]="avatarUsuarioActual()"
            [alt]="usuarioActual()?.username || 'Usuario'"
          />
        </button>

        @if (menuUsuarioAbierto()) {
          <div class="user-dropdown" (click)="$event.stopPropagation()">
            <div class="dropdown-user-info">
              <strong>{{ usuarioActual()?.nombre }}</strong>
              <span>&#64;{{ usuarioActual()?.username }}</span>
            </div>
            <hr />
            <a routerLink="/perfil" class="dropdown-item" (click)="cerrarMenuUsuario()">
              Ver perfil
            </a>
            <button
              type="button"
              class="dropdown-item dropdown-logout"
              (click)="cerrarSesion()"
            >
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
